<h2>Practice 界面 · 完成弹窗（深色主题适配）</h2>
<p class="subtitle">背景已锁定 #161616。你要求弹窗也走深色风格，按钮做对比处理。</p>

<div style="display: flex; justify-content: center; margin: 20px 0;">
  <!-- 模拟整个练习区域的深色背景 -->
  <div style="width: 420px; background: #161616; padding: 40px 20px; border-radius: 8px; position: relative;">
    
    <!-- 模拟弹窗 -->
    <div style="background: #1f1f1f; border: 1px solid #333; border-radius: 12px; padding: 24px; width: 280px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
      
      <div style="text-align: center; font-size: 18px; font-weight: 600; color: #f4f4f5; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        恭喜完成！ <span style="font-size: 22px;">🎉</span>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 8px;">
        <!-- 返回列表按钮 -->
        <button style="
          flex: 1;
          padding: 10px 0;
          background: #1f1f1f;
          color: #f4f4f5;
          border: 1px solid #444;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
        ">返回列表</button>

        <!-- 继续训练按钮 -->
        <button style="
          flex: 1;
          padding: 10px 0;
          background: #f5f5f5;

          font-weight: 600;
          cursor: pointer;

    </div>

  </div>
</div>

<div class="section">
  <p><strong>本次调整要点：</strong></p>
  <ul>
    <li>弹窗容器使用 #1f1f1f（比背景 #161616 稍亮，形成层次）</li>

    <li>“继续训练”按钮：#f5f5f5（白色）背景 + 深色文字（反转强调）</li>
    <li>整体与深色练习界面形成统一风格</li>
  </ul>
