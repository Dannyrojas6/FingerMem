<h2>Practice 界面 · 完成弹窗（继续微调）</h2>
<p class="subtitle">按钮再扁 + 再小；标题文字也缩小。</p>

<div style="display: flex; justify-content: center; margin: 20px 0;">
  <!-- 模拟深色练习背景 -->
  <div style="width: 420px; background: #161616; padding: 40px 20px; border-radius: 8px; position: relative;">
    
    <!-- 弹窗 -->
    <div style="background: #1f1f1f; border: 1px solid #333; border-radius: 14px; padding: 18px 16px 16px; width: 280px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center;">
      
      <!-- 圆形奖杯 icon -->
      <div style="
        width: 42px; 
        height: 42px; 
        background: #2a2a2a; 
        border-radius: 50%; 
        margin: 0 auto 10px; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        font-size: 22px;
      ">
        🏆
      </div>

      <!-- 标题（缩小） -->
      <div style="
        font-size: 14.5px; 
        font-weight: 600; 
        color: #f4f4f5; 
        margin-bottom: 14px; 
        line-height: 1.3;
      ">
        健康医疗场景完成！
      </div>

      <!-- 两个按钮（更扁更小） -->
      <div style="display: flex; gap: 8px;">
        <!-- 返回列表 -->
        <button style="
          flex: 1;
          padding: 5px 0;
          background: #1f1f1f;
          color: #f4f4f5;
          border: 1px solid #444;
          border-radius: 14px;
          font-size: 12px;
          font-weight: 500;
          cursor: pointer;
        ">返回列表</button>

        <!-- 继续训练 -->
        <button style="
          flex: 1;
          padding: 5px 0;
          background: #f5f5f5;
          color: #161616;
          border: none;
          border-radius: 14px;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
        ">继续训练</button>
      </div>

    </div>

  </div>
</div>

<div class="section">
  <p><strong>本次调整：</strong></p>
  <ul>
    <li>按钮高度进一步降低（padding: 5px 0）</li>
    <li>按钮文字缩小到 12px</li>
    <li>按钮整体更紧凑</li>
    <li>标题文字缩小到 14.5px</li>
    <li>icon 也相应略微缩小</li>
    <li>按钮间距调整为 8px</li>
  </ul>
</div>

<p class="subtitle">请看这个版本。按钮和标题的尺寸是否更接近你想要的紧凑感？</p>
<p style="color:#888; font-size:13px;">如果还要继续调（再扁、再小、圆角、间距、icon大小等），直接说具体要求。</p>
