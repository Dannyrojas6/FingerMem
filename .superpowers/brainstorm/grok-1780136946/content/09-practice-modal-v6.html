<h2>Practice 界面 · 完成弹窗（按钮视觉平衡）</h2>
<p class="subtitle">你观察得很准，不是错觉。白色按钮因为没有边框，吃掉的视觉空间更少，所以看起来更大。</p>

<div style="display: flex; justify-content: center; margin: 20px 0;">
  <!-- 模拟深色练习背景 -->
  <div style="width: 420px; background: #161616; padding: 40px 20px; border-radius: 8px; position: relative;">
    
    <!-- 弹窗 -->
    <div style="background: #1f1f1f; border: 1px solid #333; border-radius: 14px; padding: 18px 16px 16px; width: 280px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center;">
      
      <!-- 圆形奖杯 icon -->
      <div style="
        width: 42px; 
        height: 42px; 
        background: #2a2a2a; 
        border-radius: 50%; 
        margin: 0 auto 10px; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        font-size: 22px;
      ">
        🏆
      </div>

      <!-- 标题 -->
      <div style="
        font-size: 14.5px; 
        font-weight: 600; 
        color: #f4f4f5; 
        margin-bottom: 14px; 
        line-height: 1.3;
      ">
        健康医疗场景完成！
      </div>

      <!-- 两个按钮（已做视觉平衡） -->
      <div style="display: flex; gap: 8px;">
        <!-- 返回列表（深色） -->
        <button style="
          flex: 1;
          padding: 7px 0;
          background: #1f1f1f;
          color: #f4f4f5;
          border: 1px solid #444;
          border-radius: 14px;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
        ">返回列表</button>

        <!-- 继续训练（白色 + 浅边框做平衡） -->
        <button style="
          flex: 1;
          padding: 6px 0;
          background: #f5f5f5;
          color: #161616;
          border: 1px solid #e5e5e5;
          border-radius: 14px;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
        ">继续训练</button>
      </div>

    </div>

  </div>
</div>

<div class="section">
  <p><strong>本次调整：</strong></p>
  <ul>
    <li>白色按钮增加了极浅边框（#e5e5e5），让它“吃掉”一点空间</li>
    <li>白色按钮垂直 padding 微减 1px（6px），做光学平衡</li>
    <li>深色按钮保持 7px padding + 深边框</li>
    <li>两个按钮现在视觉上大小更接近</li>
  </ul>
</div>

<p class="subtitle">请刷新看这个版本。两个按钮现在看起来大小是否一致了？</p>
<p style="color:#888; font-size:13px;">如果还觉得有差异，或者想换别的平衡方式（比如给深色按钮加更粗边框、改文字粗细等），直接说。</p>
