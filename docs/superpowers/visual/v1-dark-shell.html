<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v1 - 全局暗色壳层 (Task 1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#161616] min-h-screen text-[#f4f4f5]">
  <!-- 模拟真实 App 的完整壳层（已改成暗色） -->
  <div class="min-h-screen bg-[#161616] text-[#f4f4f5]">
    <!-- Header - 新的暗色版本 -->
    <header class="border-b border-[#2a2a2a] bg-[#1f1f1f]">
      <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-[#f4f4f5]">基础英语 850 · 打字练习</h1>
      </div>
    </header>

    <!-- Main 内容区（内容暂时还是老的浅色卡片，用于展示过渡状态） -->
    <main class="max-w-4xl mx-auto px-6 py-8">
      
      <div>
        <h2 class="text-xl font-medium text-gray-800 mb-6">基础英语 850 · 请选择一个场景</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="block p-6 bg-white border border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
            <div class="font-medium text-lg text-gray-900">日常对话</div>
            <div class="text-sm text-gray-500 mt-1">10 个句子 · 点击开始连续练习</div>
          </div>

          <div class="block p-6 bg-white border border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
            <div class="font-medium text-lg text-gray-900">健康医疗</div>
            <div class="text-sm text-gray-500 mt-1">10 个句子 · 点击开始连续练习</div>
          </div>

          <div class="block p-6 bg-white border border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
            <div class="font-medium text-lg text-gray-900">家庭生活</div>
            <div class="text-sm text-gray-500 mt-1">10 个句子 · 点击开始连续练习</div>
          </div>

          <div class="block p-6 bg-white border border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
            <div class="font-medium text-lg text-gray-900">时间表达</div>
            <div class="text-sm text-gray-500 mt-1">10 个句子 · 点击开始连续练习</div>
          </div>
        </div>

        <p class="mt-8 text-sm text-gray-500">
          点击卡片查看场景内容，可选择单个句子练习或连续练习整个场景。
        </p>
      </div>

    </main>
  </div>

  <!-- 顶部提示条 -->
  <div class="fixed top-0 left-0 right-0 bg-blue-900/90 border-b border-blue-700 text-blue-200 text-sm py-1 px-4 text-center z-50">
    <strong>v1 - Task 1</strong>：已应用全局暗色壳层（App.tsx 修改完成）。头部和背景已变黑，内容区卡片暂时还是老样式（后续任务会继续改）。
  </div>

  <div class="fixed bottom-4 right-4 bg-zinc-900 border border-zinc-700 shadow px-3 py-1 text-xs rounded text-zinc-400">
    http://localhost:64153/v1-dark-shell.html
  </div>
</body>
</html>
