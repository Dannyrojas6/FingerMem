<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v4 - Practice 极简界面 (Task 4)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#161616] min-h-screen text-[#f4f4f5]">
  <div class="min-h-screen bg-[#161616] text-[#f4f4f5]">
    <header class="border-b border-[#2a2a2a] bg-[#1f1f1f]">
      <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-[#f4f4f5]">基础英语 850 · 打字练习</h1>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-8">
      <!-- Practice - 按 spec 极简 + 深色容器 -->
      <div class="max-w-3xl mx-auto">
        <div class="flex flex-col items-center justify-center min-h-[240px] cursor-text">
          <div class="bg-[#1f1f1f] rounded-[10px] p-6 w-full max-w-2xl">
            <!-- 12px 英文句子 -->
            <div class="text-[12px] leading-relaxed font-mono tracking-[0.5px] select-none text-center mb-5 text-[#f4f4f5]">
              <span class="text-green-600">I</span>
              <span class="text-[#f4f4f5]">·</span>
              <span class="text-[#f4f4f5]">w</span>
              <span class="text-green-600">a</span>
              <span class="text-[#f4f4f5]">n</span>
              <span class="text-[#f4f4f5]">t</span>
              <span class="text-[#f4f4f5]">·</span>
              <span class="text-[#f4f4f5]">t</span>
              <span class="text-[#f4f4f5]">o</span>
              <span class="text-green-600">·</span>
              <span class="text-green-600">g</span>
              <span class="text-green-600">o</span>
              <span class="text-[#f4f4f5]">·</span>
              <span class="text-[#f4f4f5]">h</span>
              <span class="text-[#f4f4f5]">o</span>
              <span class="text-[#f4f4f5]">m</span>
              <span class="text-[#f4f4f5]">e</span>
              <span class="text-[#f4f4f5]">·</span>
              <span class="text-[#f4f4f5]">n</span>
              <span class="text-[#f4f4f5]">o</span>
              <span class="text-[#f4f4f5]">w</span>
              <span class="text-[#f4f4f5]">.</span>
            </div>
            <!-- 10px 中文 -->
            <div class="text-[10px] text-[#a1a1aa] text-center">我现在想回家。</div>
          </div>
          <input class="opacity-0 absolute w-px h-px pointer-events-none" type="text" value="" />
        </div>
      </div>
    </main>
  </div>

  <div class="fixed top-0 left-0 right-0 bg-amber-900/90 border-b border-amber-700 text-amber-200 text-sm py-1 px-4 text-center z-50">
    <strong>v4 - Task 4</strong>：Practice 已按 spec 改成极简（头部隐藏 + #1f1f1f 容器 + 12px 英文 + 10px 中文）。完成弹窗也已更新为奖杯样式。
  </div>

  <div class="fixed bottom-4 right-4 bg-zinc-900 border border-zinc-700 shadow px-3 py-1 text-xs rounded text-zinc-400">
    http://localhost:64153/v4-dark-shell-practice.html
  </div>
</body>
</html>
