<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v3 - SceneDetail 垂直卡片 (Task 3)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#161616] min-h-screen text-[#f4f4f5]">
  <div class="min-h-screen bg-[#161616] text-[#f4f4f5]">
    <!-- Header - 暗色壳层 -->
    <header class="border-b border-[#2a2a2a] bg-[#1f1f1f]">
      <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-[#f4f4f5]">基础英语 850 · 打字练习</h1>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-8">
      
      <!-- SceneDetail - 已按 spec 改成垂直卡片 -->
      <div>
        <!-- 顶部信息 + 按钮 -->
        <div class="flex items-start justify-between">
          <div>
            <div class="text-[15px] font-semibold text-[#f4f4f5]">日常对话</div>
            <div class="text-[13px] text-[#888] mt-0.5">10 个句子</div>
          </div>
          <a href="#" class="inline-flex items-center justify-center px-5 py-2 bg-[#f5f5f5] hover:bg-[#e5e5e5] text-[#161616] font-medium text-sm rounded-[12px] whitespace-nowrap">
            连续练习本场景
          </a>
        </div>

        <div class="h-px bg-[#2a2a2a] my-4"></div>

        <!-- 垂直卡片列表 -->
        <div class="flex flex-col gap-[10px]">
          <div class="bg-[#252525] rounded-[10px] p-4 flex items-center justify-between gap-4">
            <div class="flex-1 min-w-0">
              <div class="text-[13px] font-mono text-[#f4f4f5] mb-1">Hello, how are you today?</div>
              <div class="text-[12px] text-[#a1a1aa]">你好，你今天怎么样？</div>
            </div>
            <a href="#" class="shrink-0 bg-[#232323] hover:bg-[#2a2a2a] text-[#f4f4f5] text-[13px] font-medium rounded-[8px] px-[14px] py-[5px] whitespace-nowrap">
              练习
            </a>
          </div>

          <div class="bg-[#252525] rounded-[10px] p-4 flex items-center justify-between gap-4">
            <div class="flex-1 min-w-0">
              <div class="text-[13px] font-mono text-[#f4f4f5] mb-1">What would you like to eat?</div>
              <div class="text-[12px] text-[#a1a1aa]">你想吃什么？</div>
            </div>
            <a href="#" class="shrink-0 bg-[#232323] hover:bg-[#2a2a2a] text-[#f4f4f5] text-[13px] font-medium rounded-[8px] px-[14px] py-[5px] whitespace-nowrap">
              练习
            </a>
          </div>
        </div>
      </div>

    </main>
  </div>

  <div class="fixed top-0 left-0 right-0 bg-purple-900/90 border-b border-purple-700 text-purple-200 text-sm py-1 px-4 text-center z-50">
    <strong>v3 - Task 3</strong>：SceneDetail 已改成垂直卡片列表（顶部信息+按钮 + 分隔线 + #252525 卡片 + 右侧“练习”按钮）。
  </div>

  <div class="fixed bottom-4 right-4 bg-zinc-900 border border-zinc-700 shadow px-3 py-1 text-xs rounded text-zinc-400">
    http://localhost:64153/v3-dark-shell-scenedetail.html
  </div>
</body>
</html>
